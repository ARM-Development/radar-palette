name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.6" "pip>=26.2.2" "certifi>=2026.10.19"
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3,15"]
        deps: [full]
        include:
          # Guard the optional-dependency skip paths: a minimal install must
          # still collect and pass the suite.
          - python-version: "3.13"
            deps: minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm needs history and tags to derive a version.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (full)
        if: matrix.deps == 'full'
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
          python -m pip install -e ".[all,test]"

      - name: Install (minimal)
        if: matrix.deps == 'minimal'
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
          python -m pip install -e ".[test]"

      - name: Show environment
        run: |
          python -c "import radar_palette; print('radar-palette', radar_palette.__version__)"
          python -m pip list

      - name: Run tests
        run: pytest -ra --cov=radar_palette --cov-report=term-missing

  build:
    name: build and check metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate metadata
        run: twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
          /tmp/check/bin/python -m pip install dist/*.whl
          /tmp/check/bin/python -c "import radar_palette; print(radar_palette.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
