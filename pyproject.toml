[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-palette"
description = "Advective interpolation and spectral (FFT) gridding for weather radar volumes"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Scott Collis", email = "scollis.acrf@gmail.com" },
]
maintainers = [
    { name = "Scott Collis", email = "scollis.acrf@gmail.com" },
]
keywords = [
    "weather radar",
    "interpolation",
    "gridding",
    "advection",
    "optical flow",
    "spectral methods",
    "py-art",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "arm_pyart>=2.0",
    # Declared directly because radar_palette imports them directly, rather than
    # relied on transitively through arm_pyart: a resolver is free to satisfy
    # arm_pyart differently, and an undeclared import fails at call time rather
    # than at install. The xarray floor is where xarray.DataTree landed (it was a
    # separate datatree package before); the xradar floor is where the cfradial
    # readers this package calls stabilised.
    "xarray>=2024.10.0",
    # xradar 0.12.0 is the first release requiring Python >= 3.11, which is why
    # requires-python matches it. Py-ART made the same move: arm_pyart 2.2.1
    # dropped 3.10, so a 3.10 environment can only resolve arm_pyart 2.2.0 /
    # xradar 0.11.1 -- an older stack than the one this package is tested on.
    "xradar>=0.12.0",
    "netCDF4>=1.6",
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
# Optical-flow motion estimation for radar_palette.advection.
advection = ["scikit-image>=0.22"]
# Non-uniform FFTs for radar_palette.gridding on non-uniform sweep geometries.
# All three below are alternative *engines* for the same operator, selected at
# call time by radar_palette.gridding.nufft_engines. None of them is required:
# the default engine uses only numpy/scipy and reproduces the reference
# implementation to round-off. Install one to trade a dependency for speed
# (finufft, ducc0) or for GPU execution (torch).
spectral = ["finufft>=2.2"]
# Thread-pool control for n_jobs>1 in radar_palette.gridding.cones. Optional
# because the serial default never touches the native pools; without it the
# parallel path still gives correct output but over-subscribes the CPU, so it
# warns rather than failing.
parallel = ["threadpoolctl>=3.0"]
spectral-ducc = ["ducc0>=0.33"]
spectral-torch = ["torch>=2.0", "torchkbnufft>=1.4"]
all = ["radar-palette[advection,spectral,parallel]"]
# Every optional engine, for benchmarking and for the engine-equivalence tests.
engines = ["radar-palette[spectral,spectral-ducc,spectral-torch,parallel]"]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
docs = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.15",
    "myst-nb>=1.0",
    "sphinx-design>=0.5",
]
dev = [
    "radar-palette[all,test,docs]",
    "pre-commit>=3.6",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/DIGR-Legacy/radar-palette"
Source = "https://github.com/DIGR-Legacy/radar-palette"
Issues = "https://github.com/DIGR-Legacy/radar-palette/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar_palette = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/radar_palette/_version.py"
# No release tags yet; keep an explicit pre-1.0 fallback so builds from a
# tag-less clone or an sdist without .git still produce a usable version.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: test takes more than a few seconds",
    "network: test requires network access (e.g. ARM Live, NEXRAD on S3)",
]
filterwarnings = ["error::DeprecationWarning:radar_palette.*"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "NPY",  # numpy-specific rules
    "D",    # pydocstyle
]
ignore = [
    "D105",  # magic method docstrings
    "D107",  # __init__ docstring (documented on the class)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation: a descriptive test function or method name
# says more than a docstring restating it would. Docstrings are still used where
# a test encodes a non-obvious rationale, they are just not mandatory.
# D401 (imperative mood) is dropped for tests: a fixture docstring names the
# thing the fixture *is* ("a volume with known times"), which reads worse as an
# imperative than as a noun phrase.
"tests/**" = ["D100", "D101", "D102", "D103", "D401"]
"docs/conf.py" = ["D100", "A001"]

[tool.coverage.run]
source = ["radar_palette"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
